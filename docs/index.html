<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Puppy's Magical Adventure</title>
    <!-- Critical inline CSS for immediate loading screen display -->
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .loading-content {
        text-align: center;
        color: white;
        padding: 20px;
        max-width: 80%;
      }
      
      .progress-container {
        width: 100%;
        height: 20px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin: 1rem 0;
      }
      
      #progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00d2ff, #3a7bd5);
        transition: width 0.3s ease-out;
      }
      
      .loading-animation span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin: 0 5px;
        background-color: #fff;
        border-radius: 50%;
        opacity: 0.6;
        animation: dots 1.4s infinite ease-in-out both;
      }
      
      @keyframes dots {
        0%, 80%, 100% { transform: scale(0); } 
        40% { transform: scale(1); }
      }
    </style>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <!-- Inline script to initialize loading screen -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const loadingText = document.getElementById('loading-text');
        if (loadingText) {
          loadingText.textContent = 'Waiting for game to start...';
        }
      });
    </script>
  </head>
  <body>
    <!-- Loading screen overlay -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="game-logo">
          <div class="logo-icon"></div>
          <h1>Puppy's Magical Adventure</h1>
        </div>
        <div class="progress-container">
          <div id="progress-bar"></div>
        </div>
        <p id="loading-text">Initializing...</p>
        <div class="loading-animation">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    
    <main></main>
    
    <!-- Move scripts to bottom and add defer -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/addons/p5.sound.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
